[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "techdocqa"
version = "0.1.0"
description = "Foundation for source-grounded technical documentation question answering"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain>=1,<2",
  "langchain-ollama>=1,<2",
  "pydantic>=2,<3",
  "pypdf>=6.21.4,<7",
  "langchain-community>=0.4.2,<0.5",
  "langchain-text-splitters>=1.1.3,<2",
  "beautifulsoup4>=4.15,<5",
  "urllib3>=2.8,<3",
  "certifi>=2026.10.18",
  "chromadb>=1.5.9,<2",
  "langchain-chroma>=1.1,<2",
  "numpy>=2,<3",
  "rank-bm25>=0.2.2,<0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
# Keyphrases (FR-08) and the spaCy segmentation policy (FR-06 P1). Entities and classification need neither.
nlp = ["spacy>=3.8.18,<3.9", "rake-nltk>=1.0.6,<1.1"]

[project.scripts]
techdocqa = "techdocqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
markers = [
  "live: optional real-network documentation smoke; disabled without --live",
  "live_model: optional test against the configured real model provider; disabled without --live-model",
]
