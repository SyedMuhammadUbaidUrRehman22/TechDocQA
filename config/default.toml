# Relative paths resolve against this file's directory.
framework = "langchain"
allowed_directories = ["../data/corpus"]
data_directory = "../data"

[model]
provider = "ollama"
chat_model = "qwen3:1.7b"
embedding_model = "nomic-embed-text:latest"
# Verified against installed Ollama 0.40.13 metadata: tokenizer.ggml.model=gpt2 (byte-level BPE), context_length 40960.
# Sent to Ollama as num_ctx; prompts are budgeted so prompt + output always fit.
context_window = 8192
chat_model_digest = "8f68893c685c3ddff2aa3fffce2aa60a30bb2da65ca488b61fff134a4d1730e7"
chat_tokenizer = "byte-bpe"
# The installed template adds about 60 tokens around the system and user messages.
chat_template_reserve_tokens = 96
max_output_tokens = 512
# qwen3 thinks by default; answers must not spend the output budget on hidden reasoning.
chat_reasoning = false
# Verified against installed Ollama 0.40.10 metadata; embedding API clamps to the GGUF context.
embedding_context_window = 2048
embedding_tokenizer = "bert"
embedding_model_digest = "0a109f422b47e3a30ba2b10eca18548e944e8a23073ee3f3e947efcf3c45e59f"
embedding_prefix = "search_document: "
embedding_query_prefix = "search_query: "
embedding_dimension = 768
# Measured on the installed model; a vector off the unit sphere is rejected as invalid.
embedding_normalization = "l2"
embedding_batch_size = 32
base_url = "http://127.0.0.1:11434"
temperature = 0.0
timeout_seconds = 60

[ingestion]
max_file_bytes = 20971520
max_pages = 500
parse_timeout_seconds = 60
min_text_characters = 100

[chunking]
size = 1000
overlap = 150
minimum = 100
unit = "characters"

[retrieval]
mode = "vector"
candidate_depth = 20
top_k = 5
bm25_k1 = 1.2
bm25_b = 0.75
rrf_k = 60
rerank = false
rerank_max_candidates = 20

# FR-18 refusal thresholds, one set per mode on that mode's 0-1 relevance scale (Q-07), copied from the proposal in
# reports/evaluation/eval_c4ab1f1397fa469489137f611b74cdf7.md. Each applies only while scoring_config_id names the
# active scale: a new embedding model or BM25 setting needs a new eval run and a new section.
[retrieval.sufficiency.bm25]
min_top_score = 0.297285
min_chunk_score = 0.297285
min_supporting_chunks = 1
calibration_run_id = "eval_c4ab1f1397fa469489137f611b74cdf7"
scoring_config_id = "sc_be0c0c0942c7f01a9f79ec75effb0366f2cd39d5ec70ee4e71ba64b4a3f43507"

[retrieval.sufficiency.vector]
min_top_score = 0.858223
min_chunk_score = 0.858223
min_supporting_chunks = 1
calibration_run_id = "eval_c4ab1f1397fa469489137f611b74cdf7"
scoring_config_id = "sc_c40598d9e99ee950f32c22d25aff430b6602a18316cb48f50ee5996048005cb2"

[answering]
max_question_characters = 1000
strict_citations = true
query_log = true

[online]
max_pages_per_run = 10
connect_timeout_seconds = 5
read_timeout_seconds = 10
retries = 2
max_redirects = 3
request_interval_seconds = 1

