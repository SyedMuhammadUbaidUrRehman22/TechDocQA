# FR-07 gazetteer (P9-3). Written by Claude Code on 2026-11-07, before any gold labels existed, and frozen for the
# round-1 entity gold set (P9-9). Revised on 2026-11-12, after round 1 was scored, to align types with the guidelines'
# type table: named abstractions are CONCEPT, commands, classes and SQL commands are IDENTIFIER, and COMPONENT is kept
# for running parts. No alias was added for a term the round-1 labels missed. Round 1 is therefore reported as tuned,
# and the round-2 entity set is sampled after this revision, so it is held out.
#
# name: the canonical name, also the --entity filter key (compared without case); it must be one of its aliases.
# aliases: matched as whole words. case_sensitive applies to every alias of the entry.
# ambiguous: aliases that are also ordinary words or names. They count as exact (confidence 1.0) only in a document
#   whose user technology is the entry or the entry's technology, or that also contains an unambiguous alias of the
#   entry, or whose technology holds by either rule. Otherwise they are stored at 0.4, unverified, and never filter.
# technology: the product a component or concept belongs to. category: an optional FR-09 category link.
#
# Types: TECHNOLOGY (a product, language or platform), COMPONENT (a running part of a system: a server role, process,
# subsystem or built-in service), CONCEPT (a technical idea or named abstraction), PROTOCOL (a network or wire
# protocol), IDENTIFIER (a name you would type: a command, class or SQL command).
# Identifiers (dotted names, snake_case, --flags, camelCase) and common protocols come from fixed patterns in code.
version = "techdocqa-gazetteer-2026-11-12"

